name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a change to the runner images (or to the Xcode 27 preview image) is
    # noticed even when nobody has pushed. GitHub switches scheduled workflows off in a
    # public repository after 60 days without repository activity.
    - cron: "23 5 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Documentation, hygiene and policy checks
        run: ./Scripts/check-repo.py

      - name: Test the repository checks themselves
        run: python3 -m unittest discover -s Scripts -p 'test_*.py'

      - name: ShellCheck the scripts
        run: shellcheck Scripts/*.sh

      - name: Lint the workflows (actionlint)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          # SHA-256 of the linux_amd64 tarball, from the release's checksums file.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

      - name: Audit the workflows for security problems (zizmor)
        env:
          ZIZMOR_VERSION: "1.30.1"
          # SHA-256 of the x86_64-unknown-linux-gnu tarball: the `digest` the release lists.
          ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
        run: |
          curl -sSfL -o zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum --check --strict -
          tar -xzf zizmor.tar.gz zizmor
          ./zizmor --offline --no-progress --persona auditor .github

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15, Xcode 16.0 (minimum toolchain)
            runner: macos-15
            xcode: "16.0"
          - name: macOS 26, Xcode 26.6
            runner: macos-26
            xcode: "26.6"
          - name: Intel (x86_64), macOS 15, Xcode 16.4
            runner: macos-15-intel
            xcode: "16.4"
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -m

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build (release)
        run: swift build -c release

  # The Xcode 27 preview image. Useful early warning about the next toolchain, but
  # a preview must never be able to block a merge, so it is not part of `CI` below.
  preview:
    name: Xcode 27 (preview, allowed to fail)
    # A pull request run is already four macOS jobs (three test legs and the packaging
    # dry run), and a free account can run only five at once, so the preview only runs
    # on master and on the weekly schedule.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: xcode-27
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build and test
        run: |
          swift build
          swift test

  package:
    name: Release packaging (dry run)
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the universal app, the CLI and the disk image
        run: ./Scripts/package-release.sh

      - name: Upload the artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # One stable name to require in branch protection, however the matrix changes.
  ci:
    name: CI
    if: ${{ always() }}
    needs: [checks, test, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          read -ra results <<< "${RESULTS}"
          for result in "${results[@]}"; do
            [ "${result}" = "success" ] || exit 1
          done
