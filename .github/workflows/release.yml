name: Release

# Publishing: push a tag named for the version in Sources/ApexKit/Version.swift,
# after moving the changelog's [Unreleased] section under that version, then approve
# the `release` environment when the run asks. See docs/MAINTAINING.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and package
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tagged commit must be on master
        id: commit
        run: |
          commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "${commit}" origin/master; then
            echo "::error::${commit} is not on master; releases are cut from master only."
            exit 1
          fi
          echo "sha=${commit}" >> "${GITHUB_OUTPUT}"

      - name: The tag must match the version in the source
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(./Scripts/version.sh)"
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::Tag ${TAG} does not match the version in Sources/ApexKit/Version.swift (v${version})."
            exit 1
          fi

      - name: Release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: ./Scripts/release-notes.sh "${TAG#v}" > "${RUNNER_TEMP}/RELEASE_NOTES.md"

      - name: Test
        run: swift test

      - name: Build the universal app, the CLI and the disk image
        run: ./Scripts/package-release.sh

      - name: Add the release notes to the artefacts
        run: cp "${RUNNER_TEMP}/RELEASE_NOTES.md" dist/RELEASE_NOTES.md

      - name: Upload the artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish the GitHub release
    needs: build
    # Waits for the maintainer's approval (see docs/MAINTAINING.md). The environment's
    # tag rule (`v*`) also means only a version tag can reach this job.
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store it
    steps:
      # The run can wait days for approval. Anyone who could move the tag in that time
      # would get their commit published, and the source archives GitHub generates from
      # the tag, next to artefacts built from another commit.
      - name: The tag must still point at the commit that was built
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BUILT: ${{ needs.build.outputs.commit }}
        run: |
          now="$(gh api "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${TAG}" --jq .sha)"
          if [ "${now}" != "${BUILT}" ]; then
            echo "::error::Tag ${TAG} now points at ${now}, not at the commit that was built (${BUILT})."
            exit 1
          fi

      - name: Download the artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist

      # Artifact attestations need a public repository (or GitHub Enterprise), so
      # this is skipped, not failed, on a private one (a fork, for instance).
      - name: Attest build provenance
        id: attest
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip

      # Ship the attestation next to the artefacts: it can then be checked without a
      # GitHub login (`gh attestation verify --bundle`), and OpenSSF Scorecard's
      # Signed-Releases check looks for a *.sigstore.json release asset.
      - name: Keep the attestation bundle with the artefacts
        if: ${{ steps.attest.outcome == 'success' }}
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ github.ref_name }}
        run: cp "${BUNDLE}" "dist/ApexControl-${TAG#v}.sigstore.json"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          args=()
          case "${TAG}" in
            *-*) args+=(--prerelease) ;;
          esac
          assets=(dist/*.dmg dist/*.zip dist/SHA256SUMS)
          for bundle in dist/*.sigstore.json; do
            if [ -e "${bundle}" ]; then assets+=("${bundle}"); fi
          done
          gh release create "${TAG}" \
            "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Apex Control ${TAG#v}" \
            --notes-file dist/RELEASE_NOTES.md \
            --verify-tag \
            "${args[@]}"
